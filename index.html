<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0e0e10" />
    <meta
      name="description"
      content="Turn a selfie and a photo of your signature into files that fit your application form. Runs in your browser; nothing is uploaded."
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formify</title>
    <script>
      // set the theme before the page paints, so a dark-mode visitor never sees a light flash
      try {
        var saved = localStorage.getItem('formify-theme')
        var dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch (error) {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
